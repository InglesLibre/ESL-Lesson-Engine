<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESL Lesson Engine</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/lesson.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="header-content">
                <h1>ESL Lesson Engine</h1>
                <div class="lesson-selector">
                    <select id="lessonSelect" aria-label="Select Lesson">
                        <option value="">Select a lesson...</option>
                    </select>
                </div>
                <div class="progress-indicator">
                    <span id="progressText">0 / 0</span>
                    <div class="progress-bar">
                        <div id="progressFill" class="progress-fill"></div>
                    </div>
                </div>
            </div>
        </header>
        
        <main id="mainContent">
            <div class="slide-container">
                <div id="slideContent" class="slide-content">
                    <!-- Slides rendered here -->
                </div>
                
                <div class="navigation-controls">
                    <button id="prevBtn" class="nav-btn" aria-label="Previous slide">Previous</button>
                    <span id="slideCounter" class="slide-counter">Slide 1 of 1</span>
                    <button id="nextBtn" class="nav-btn" aria-label="Next slide">Next</button>
                </div>
            </div>
        </main>
        
        <footer>
            <div class="footer-content">
                <span id="teacherNotesToggle" class="teacher-notes-toggle">Teacher Notes</span>
                <span id="themeToggle" class="theme-toggle">Toggle Theme</span>
            </div>
        </footer>
    </div>
    
    <div id="teacherNotesPanel" class="teacher-notes-panel" style="display: none;">
        <div class="teacher-notes-content">
            <h2>Teacher Notes</h2>
            <div id="teacherNotesContent"></div>
            <button id="closeNotesBtn" class="close-btn">Close</button>
        </div>
    </div>
    
    <!-- Load scripts in the correct order -->
    <!-- Utilities and core first -->
    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/imageLoader.js"></script>
    
    <!-- Activities -->
    <script src="js/activities/gapfill.js"></script>
    <script src="js/activities/dropdown.js"></script>
    <script src="js/activities/multipleChoice.js"></script>
    <script src="js/activities/dragdrop.js"></script>
    <script src="js/activities/matching.js"></script>
    <script src="js/activities/speaking.js"></script>
    
    <!-- Core engine -->
    <script src="js/renderer.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/router.js"></script>
    
    <!-- App last -->
    <script src="js/app.js"></script>
</body>
</html>
