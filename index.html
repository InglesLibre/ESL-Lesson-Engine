<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESL Lesson Generator</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/print.css" media="print">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header id="mainHeader">
            <div class="header-content">
                <div class="logo">
                    <h1>ESL Lesson Generator</h1>
                </div>
                
                <div class="header-controls">
                    <div class="lesson-selector">
                        <select id="lessonSelect" aria-label="Select Lesson">
                            <option value="">Select a lesson...</option>
                        </select>
                    </div>
                    
                    <div class="progress-indicator">
                        <span id="progressText">0 / 0</span>
                        <div class="progress-bar">
                            <div id="progressFill" class="progress-fill"></div>
                        </div>
                    </div>
                    
                    <div class="header-actions">
                        <button id="fullscreenBtn" class="header-btn" title="Fullscreen">⛶</button>
                        <button id="themeToggle" class="header-btn" title="Toggle Theme">🎨</button>
                    </div>
                </div>
            </div>
        </header>
        
        <!-- Main Content -->
        <main id="mainContent">
            <div class="slide-container">
                <!-- Slide Metadata Bar -->
                <div id="metadataBar" class="metadata-bar">
                    <span id="slideLevel" class="metadata-item">Level: <strong>B2</strong></span>
                    <span id="slideDuration" class="metadata-item">⏱ <span id="slideTimer">0:00</span></span>
                    <span id="slideExam" class="metadata-item">Exam: <strong>Cambridge B2 First</strong></span>
                </div>
                
                <!-- Slide Content -->
                <div id="slideContent" class="slide-content">
                    <!-- Slides rendered here -->
                </div>
                
                <!-- Navigation -->
                <div class="navigation-controls">
                    <button id="prevBtn" class="nav-btn" aria-label="Previous slide">← Previous</button>
                    <span id="slideCounter" class="slide-counter">Slide 1 of 1</span>
                    <button id="nextBtn" class="nav-btn" aria-label="Next slide">Next →</button>
                </div>
            </div>
        </main>
        
        <!-- Footer -->
        <footer id="mainFooter">
            <div class="footer-content">
                <span id="teacherNotesToggle" class="footer-btn">📝 Teacher Notes</span>
                <span id="tocToggle" class="footer-btn">📑 Table of Contents</span>
                <span id="printBtn" class="footer-btn">🖨 Print</span>
            </div>
        </footer>
    </div>
    
    <!-- Teacher Notes Panel -->
    <div id="teacherNotesPanel" class="panel panel-right" style="display: none;">
        <div class="panel-header">
            <h2>Teacher Notes</h2>
            <button id="closeNotesBtn" class="panel-close-btn">×</button>
        </div>
        <div class="panel-content" id="teacherNotesContent">
            <!-- Teacher notes rendered here -->
        </div>
    </div>
    
    <!-- Table of Contents Panel -->
    <div id="tocPanel" class="panel panel-right" style="display: none;">
        <div class="panel-header">
            <h2>Table of Contents</h2>
            <button id="closeTocBtn" class="panel-close-btn">×</button>
        </div>
        <div class="panel-content" id="tocContent">
            <!-- TOC rendered here -->
        </div>
    </div>
    
    <!-- JavaScript -->
    <script src="js/helpers.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/image-loader.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/router.js"></script>
    
    <!-- Slide Types -->
    <script src="js/slideTypes/title.js"></script>
    <script src="js/slideTypes/speaking.js"></script>
    <script src="js/slideTypes/grammar.js"></script>
    <script src="js/slideTypes/vocabulary.js"></script>
    <script src="js/slideTypes/teacherNotes.js"></script>
    
    <!-- Activities -->
    <script src="js/activities/dropdown.js"></script>
    <script src="js/activities/gapfill.js"></script>
    <script src="js/activities/matching.js"></script>
    <script src="js/activities/multipleChoice.js"></script>
    <script src="js/activities/dragdrop.js"></script>
    
    <!-- Core Engine -->
    <script src="js/renderer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
